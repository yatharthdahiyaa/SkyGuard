# SkyGuard AI - Eclipse Mosquitto Configuration
# File: mosquitto/mosquitto.conf

# Standard MQTT listener over TCP
listener 1883 0.0.0.0

# WebSocket listener for browser clients
listener 9001 0.0.0.0
protocol websockets

# Allow anonymous connections for internal docker network
allow_anonymous true

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
